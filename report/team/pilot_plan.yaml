# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Người phụ trách file: Ngô Gia Bảo (CP4). Mọi số D1, D3 do src/lab13.py (hàm chay_nhiem_vu_d) in ra.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: co_mau(0,70; 0,75) = 1.251 yêu cầu mỗi nhóm (z chính xác 1,95996 và 0,84162).
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 1.251 × 2,48 = 3.103 mỗi nhóm
#      → 3.103 / 75 = 42 nhân viên mỗi nhóm, tổng 84 > 40 nhân viên: KHÔNG đủ người.
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251: KHÔNG đạt mức chênh 5 điểm.
#   d) 6 depot mỗi nhóm: tối đa = 6 / 0,02 = 300 (và chỉ 6 cụm < 20): loại.
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: 20m / (0,98 + 0,02m) ≥ 859
#      → 2,82m ≥ 841,82 → m ≥ 299 yêu cầu mỗi nhân viên (DE = 6,96); tổng 2 × 20 × 299 = 11.960 yêu cầu.
#   Hệ quả bất lợi: thiết kế cho 6 điểm, nếu tác động thật chỉ 5 điểm thì power còn 0,64 (NormalIndPower, n = 859).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng các depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên trong cùng depot chia sẻ câu trả lời; khoá trợ lý theo tài khoản, log lượt mở theo staff_id, đo tỉ lệ nhóm đối chứng mở trợ lý (mục tiêu 0%).
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu 2026-12-07, không sửa sau khi chạy.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Không cách chia nào vừa tách được tác động vừa đủ mẫu cho 5 điểm với 40 nhân viên. Nhóm chọn chia theo nhân viên 20 + 20
#   (tách tác động tốt) và chấp nhận MDE = 6 điểm, cần ≥ 299 yêu cầu/nhân viên. Trong phạm vi noi_dia + hang_nang mỗi nhân viên
#   nhận ~30,7 yêu cầu/ngày (1.500 × 982/1.200 ÷ 40), nên cần ~10 ngày làm việc ở bước 0,50. Giám đốc vận hành ký chấp nhận power 0,64 ở mức 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Đợt chạy thử: 4,25% (51/1.200) toàn bộ; 3,97% (39/982) trong phạm vi noi_dia + hang_nang. Một ngưỡng tuyệt đối 3% sẽ dừng pilot
#   ngay tuần đầu, nên luật an toàn so với nhóm đối chứng (chênh ≥ +2 điểm) kèm trần tuyệt đối 6%, cộng điều kiện 0 ca hoàn trùng (ca 20).

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang ở cả 12 depot (982/1.200 = 81,8% khối lượng mẫu); cps 0,22× và 0,69× so với 12.000 đ [simulated]. Loại quoc_te (1,88×, thành công 27,3%, chạy lại không giúp) và doi_tac (0,85×, điều khoản riêng) [simulated]"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    method: "Bốc thăm 40 nhân viên CSKH bằng code, seed 20261207, phân tầng theo depot; 20 dùng trợ lý, 20 đối chứng"
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần: 4 → 10 → 20 nhân viên dùng trợ lý; chỉ số chính chỉ đo từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận: 0.05 không đạt được với 40 nhân viên (tối đa 1.000 < 1.251)
    alpha: 0.05
    power: 0.80
    power_if_true_effect_0_05: 0.64
    n_per_arm: 859                # cỡ mẫu hiệu dụng; tương ứng 20 × 299 = 5.980 yêu cầu thực mỗi nhóm
    requests_per_staff_min: 299
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng depot, cùng phạm vi noi_dia + hang_nang"
    spillover_risk: "Trung bình: nhân viên cùng depot có thể chia sẻ câu trả lời; giảm bằng khoá trợ lý theo tài khoản, log agent_suggestion_shown theo staff_id, ngưỡng 0% lượt mở từ nhóm đối chứng"
    predeclared: "Có: chỉ số chính, MDE 0,06, ba luật dừng và ngày quyết định chốt trong file này trước 2026-12-07; phân tích theo nhóm được bốc thăm (intention-to-treat)"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm, hoặc vượt 6% (đợt chạy thử 3,97% trong phạm vi), hoặc có ≥ 1 ca hoàn trùng cho cùng một đơn TRONG 3 ngày liên tiếp (ca hoàn trùng: ngay lập tức) THÌ Giám đốc vận hành bật cờ tắt trợ lý trong 30 phút và Kỹ sư trưởng agent rà toàn bộ trace của các ca đó trong 48 giờ KHÔNG THÌ cấm chuyển sang bước rollout tiếp theo và cấm bật lại trợ lý"
    - "NẾU chi phí mỗi việc thành công trong phạm vi (chưa cộng cố định) > 5.147 đ [simulated, = kịch bản làm lại gấp đôi; đợt chạy thử 3.414 đ] TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy (3.252 đ [simulated]) trong 3 ngày làm việc KHÔNG THÌ cấm mở lại hang_nang và cấm tăng tỉ lệ rollout"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo trên số được xem lại) > 40% (đợt chạy thử 21,1% trong phạm vi) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên nhóm trợ lý và gửi báo cáo nguyên nhân trong 3 ngày làm việc KHÔNG THÌ cấm chuyển bước rollout và cấm tính tuần đó vào cỡ mẫu chỉ số chính"
  interim_looks: "chỉ kiểm tra chỉ số an toàn (mở lại 7 ngày, hoàn trùng) hằng ngày; chi phí và bỏ qua gợi ý hằng tuần; không xem chỉ số chính trước 2027-01-12"
  rollback: "Giám đốc vận hành bật cờ tắt trợ lý trên bảng điều khiển, hiệu lực trong 30 phút; yêu cầu đang mở chuyển về hàng đợi nhân viên kèm tóm tắt (handoff_to_staff); khách được phục vụ bằng luồng nhân viên tự làm 6 phút/yêu cầu như trước pilot"
  timeline:
